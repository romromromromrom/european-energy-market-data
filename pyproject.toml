[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "energy-scraper"
version = "0.1.0"
description = "Auditable European energy market data collector"
requires-python = ">=3.12"
dependencies = [
  "anyio>=4.6,<4.12", "beautifulsoup4>=4.12,<5", "fastapi>=0.115,<0.116", "httpx>=0.27,<0.28", "orjson>=3.10", "pydantic>=2.8",
  "PyYAML>=6", "tenacity>=9", "typer>=0.15", "uvicorn>=0.34",
]

[project.optional-dependencies]
browser = ["playwright>=1.50"]
parquet = ["pyarrow>=18"]
test = ["pytest>=8", "pytest-cov>=6"]

[project.scripts]
energy-scraper = "energy_scraper.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/energy_scraper"]

[tool.hatch.build.targets.wheel.force-include]
"src/energy_scraper/ui" = "energy_scraper/ui"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
